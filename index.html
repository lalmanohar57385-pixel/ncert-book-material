let pageHistory=[];
let currentPage="home";

function navigateTo(page){
  if(currentPage !== page){
    pageHistory.push(currentPage);
  }

  currentPage=page;

  history.pushState(
    {page:page},
    "",
    "#"+page
  );
}

window.goBack=function(){

  if(pageHistory.length===0){
    home();
    return;
  }

  const previous=pageHistory.pop();

  currentPage=previous;

  history.replaceState(
    {page:previous},
    "",
    "#"+previous
  );

  renderPrevious(previous);
};

window.addEventListener("popstate",function(){
  if(pageHistory.length){
    const previous=pageHistory.pop();
    currentPage=previous;
    renderPrevious(previous);
  }else{
    home();
  }
});

  }else{

window.openChapters=function(classNo,subject,book){

  navigateTo("chapters");

  const key=classNo+"|"+subject+"|"+book;

  let list=chapters[key];

  /*
    If exact chapter names are not available,
    show numbered chapter structure.
  */

  if(!list){

    let count=12;

    if(classNo==="1" || classNo==="2") count=10;
    if(classNo==="3") count=14;
    if(classNo==="4" || classNo==="5") count=14;
    if(classNo==="6") count=13;
    if(classNo==="7" || classNo==="8") count=12;

    list=[];

    for(let i=1;i<=count;i++){
      list.push("Chapter "+i);
    }
  }

  let html=`
    <button class="back" onclick="goBack()">← Back</button>

    <h2 class="title">
      📕 ${book}
    </h2>

    <div class="card-grid">
  `;

  list.forEach((chapter,index)=>{

    html+=`
      <div class="card"
           onclick="openMaterial(
             '${classNo}',
             '${subject}',
             '${escapeText(book)}',
             '${escapeText(chapter)}'
           )">

        <h3>📖 ${chapter}</h3>

        <p>Open PDF / Material →</p>

      </div>
    `;
  });

  html+=`</div>`;

  document.getElementById("app").innerHTML=html;
};


/* =========================
   MATERIAL
========================= */

window.openMaterial=async function(
  classNo,
  subject,
  book,
  chapter
){

  navigateTo("material");

  document.getElementById("app").innerHTML=`

    <button class="back" onclick="goBack()">← Back</button>

    <h2 class="title">
      📖 ${chapter}
    </h2>

    <p>
      Class ${classNo} → ${subject} → ${book}
    </p>

    <div id="materialList">
      <div class="empty">
        ⏳ Loading material...
      </div>
    </div>
  `;

  try{

    const q=query(
      collection(db,"materials"),
      orderBy("createdAt","desc")
    );

    const snapshot=await getDocs(q);

    let found=[];

    snapshot.forEach(doc=>{

      const data=doc.data();

      const sameClass=
        Number(data.classNumber)===Number(classNo);

      const sameSubject=
        data.subject===subject;

      const sameChapter=
        !data.chapter ||
        data.chapter===chapter;

      if(
        sameClass &&
        sameSubject &&
        sameChapter
      ){
        found.push(data);
      }

    });

    const box=document.getElementById("materialList");

    if(found.length===0){

      box.innerHTML=`
        <div class="empty">
          📄 इस chapter का PDF अभी upload नहीं हुआ।
          <br><br>
          Admin panel से material upload किया जा सकता है।
        </div>
      `;

      return;
    }

    box.innerHTML=found.map(item=>`

      <div class="material">

        <h3>📄 ${item.title || "Study Material"}</h3>

        <p>
          ${item.chapter || chapter}
        </p>

        <button
          onclick="window.open('${item.pdfUrl}','_blank')">
          📖 Open PDF
        </button>

      </div>

    `).join("");

  }catch(error){

    console.error(error);

    document.getElementById("materialList").innerHTML=`
      <div class="empty">
        ❌ Material load नहीं हो पाया।
      </div>
    `;
  }
};

window.showAllMaterials=async function(){

  navigateTo("all-material");

  document.getElementById("app").innerHTML=`

    <button class="back" onclick="goBack()">← Back</button>

    <h2 class="title">📄 All Study Material</h2>

    <div id="allMaterials">
      <div class="empty">⏳ Loading...</div>
    </div>
  `;

  try{

    const q=query(
      collection(db,"materials"),
      orderBy("createdAt","desc")
    );

    const snapshot=await getDocs(q);

    const list=[];

    snapshot.forEach(doc=>{
      list.push(doc.data());
    });

    const box=document.getElementById("allMaterials");

    if(!list.length){

      box.innerHTML=`
        <div class="empty">
          अभी कोई material upload नहीं हुआ।
        </div>
      `;

      return;
    }

    box.innerHTML=list.map(item=>`

      <div class="material">

        <h3>📄 ${item.title}</h3>

        <p>
          Class ${item.classNumber}
          • ${item.subject}
          • ${item.chapter || "Material"}
        </p>

        <button
          onclick="window.open('${item.pdfUrl}','_blank')">
          Open PDF
        </button>

      </div>

    `).join("");

  }catch(error){

    console.error(error);

    document.getElementById("allMaterials").innerHTML=`
      <div class="empty">
        ❌ Error loading materials.
      </div>
    `;
  }
};

window.startMCQ=function(){

  mcqIndex=0;
  score=0;

  navigateTo("quiz");

  showQuestion();
};


function showQuestion(){

  const q=mcqs[mcqIndex];

  let html=`

    <button class="back" onclick="goBack()">← Back</button>

    <h2 class="title">
      Question ${mcqIndex+1}/${mcqs.length}
    </h2>

    <div class="card">

      <h3>${q.q}</h3>

      <br>
  `;

  q.options.forEach((option,index)=>{

    html+=`
      <button
        style="
          display:block;
          width:100%;
          padding:13px;
          margin:8px 0;
          border:1px solid #ddd;
          border-radius:8px;
          background:white;
          cursor:pointer;
        "
        onclick="answerMCQ(${index})">

        ${option}

      </button>
    `;
  });

  html+=`</div>`;

  document.getElementById("app").innerHTML=html;
}


window.answerMCQ=function(index){

  if(index===mcqs[mcqIndex].answer){
    score++;
  }

  mcqIndex++;

  if(mcqIndex>=mcqs.length){
    showResult();
  }else{
    showQuestion();
  }
};


function showResult(){

  navigateTo("result");

  document.getElementById("app").innerHTML=`

    <button class="back" onclick="goBack()">← Back</button>

    <div class="hero">

      <h1>🎉 MCQ Complete</h1>

      <p>
        Your Score:
        <b>${score}/${mcqs.length}</b>
      </p>

    </div>

    <div class="card"
         onclick="startMCQ()">

      <h3>🔄 Try Again</h3>

      <p>Practice again</p>

    </div>
  `;
}

/* =========================
   RENDER PREVIOUS
========================= */

function renderPrevious(page){

  if(page==="home"){
    home();
    return;
  }

  /*
    For safety, if the user uses browser Back,
    return to home for pages whose parameters
    are no longer available.
  */

  if(
    page==="classes" ||
    page.startsWith("class")
  ){
    openClasses();
    return;
  }

  if(page==="mcq"){
    openMCQ();
    return;
  }

  if(page==="planner"){
    openPlanner();
    return;
  }

  if(page==="all-material"){
    showAllMaterials();
    return;
  }

  home();
}


/* =========================
   MENU
========================= */

window.openMenu=function(){

  document
    .getElementById("sideMenu")
    .classList.add("open");

  document
    .getElementById("overlay")
    .classList.add("show");
};


window.closeMenu=function(){

  document
    .getElementById("sideMenu")
    .classList.remove("open");

  document
    .getElementById("overlay")
    .classList.remove("show");
};


/* =========================
   ESCAPE TEXT
========================= */

function escapeText(text){

  return String(text)
    .replace(/'/g,"&#39;")
    .replace(/"/g,"&quot;");
}
